<div class="min-h-screen bg-slate-100 p-6 md:p-10 font-sans text-slate-800 flex flex-col gap-8 max-w-7xl mx-auto">
  
  <!-- Encabezado / Título opcional de la App -->
  <header class="flex items-center justify-between border-b border-slate-200 pb-4">
    <h1 class="text-2xl font-bold bg-linear-to-r from-pink-600 to-purple-600 bg-clip-text text-transparent">
      🍕 Pizzería — Sistema de Pedidos y Ventas
    </h1>
  </header>

  <app-formulario-pedido 
    class="block w-full bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl shadow-slate-200/50"
    (pizzaAgregada)="manejarPizzaAgregada($event)">
  </app-formulario-pedido>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
    
    <app-detalle-pedido 
      class="lg:col-span-7 block bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl shadow-slate-200/50 flex flex-col"
      [listaPizzas]="pizzasTemporal" 
      (quitarPizzaIndex)="manejarQuitarPizza($event)"
      (terminarPedidoEvent)="manejarTerminarPedido()">
    </app-detalle-pedido>

    <app-consultas-ventas 
      class="lg:col-span-5 block bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-xl shadow-slate-200/50 flex flex-col">
    </app-consultas-ventas>
    
  </div>
</div>
